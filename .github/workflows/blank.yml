name: Signature database checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          set -euo pipefail
          test -d singatures
          test -f singatures/singatures.txt
          test -f README.md
          test -f LICENSE.md

      - name: Check signature database
        run: |
          set -euo pipefail
          file=singatures/singatures.txt
          test -s "$file"
          if grep -n $'\r' "$file"; then exit 1; fi
          if grep -nE '^[[:space:]]+$' "$file"; then exit 1; fi
          if grep -nE '^[[:space:]]' "$file"; then exit 1; fi
          if grep -nE '[[:space:]]+$' "$file"; then exit 1; fi

      - name: Check duplicate signatures
        run: |
          set -euo pipefail
          duplicates="$(sort singatures/singatures.txt | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate signatures found:"
            printf '%s\n' "$duplicates"
            exit 1
          fi

      - name: Check for obvious secrets
        run: |
          set -euo pipefail
          file=singatures/singatures.txt
          if grep -nEi '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{20,})' "$file"; then
            echo "Possible secret/token detected."
            exit 1
          fi

      - name: Validate documentation
        run: |
          set -euo pipefail
          test -s README.md
          grep -q '^#' README.md
          test -s LICENSE.md
          grep -qi 'permission is hereby granted' LICENSE.md

      - name: Validate workflow files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text(encoding='utf-8')
              if not re.search(r'^name:\s*.+$', text, re.MULTILINE):
                  raise SystemExit(f'{path}: missing name')
              if not re.search(r'^jobs:\s*$', text, re.MULTILINE):
                  raise SystemExit(f'{path}: missing jobs')
          PY

      - name: Check file sizes
        run: |
          set -euo pipefail
          max_bytes=$((5 * 1024 * 1024))
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            if (( size > max_bytes )); then
              echo "File is larger than 5 MiB: $file"
              exit 1
            fi
          done < <(find . -type f -not -path './.git/*' -print0)

      - name: All checks passed
        run: echo "All repository checks passed."
